name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check code style (flake8)
        run: flake8 src/ dashboard/ run_pipeline.py tests/

      # Unit tests, an end-to-end pipeline run (saved hyperparameters, artefacts written to a
      # temporary directory) and a Streamlit dashboard test
      - name: Run tests
        run: pytest -v
