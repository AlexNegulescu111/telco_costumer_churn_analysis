name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Check code style (flake8)
        run: flake8 src/ dashboard/ run_pipeline.py

      # Uses the tuned hyperparameters saved in models/*.json, so Optuna tuning is skipped
      - name: Run pipeline
        run: python run_pipeline.py
